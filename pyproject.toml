[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cronsplain-cli"
version = "1.0.0"
description = "Explain a 5-field cron expression in plain English and show its next run times, with no dependencies."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "All Rights Reserved" }
authors = [{ name = "sidcore-dev" }]
keywords = ["cron", "cli", "devtools", "scheduling"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Environment :: Console",
    "Topic :: Software Development :: Build Tools",
]

[project.scripts]
cronsplain-cli = "cronsplain_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
